.brand::after {
  content:"";
  position:absolute;
  inset:11px;
  pointer-events:none;
  border:1px solid rgba(255,202,76,.20);
}

.main {
  min-width:0;
  padding:38px 34px 28px;
  background:
    radial-gradient(circle at 50% 0%, rgba(126,78,7,.07), transparent 27%),
    #080809;
}

.title {
  text-align:center;
  margin:0 0 4px;
  font-family:Georgia, "Times New Roman", serif;
  font-weight:900;
  font-size:clamp(34px,4vw,58px);
  letter-spacing:.5px;
  color:#f5c25b;
  text-shadow:0 2px 0 #6f4300, 0 0 16px rgba(255,189,62,.18);
}

.subtitle {
  text-align:center;
  color:#bbb;
  font-size:15px;
  margin-bottom:30px;
}

.search-shell {
  display:flex;
  gap:12px;
  align-items:stretch;
  margin:0 auto 20px;
}

.searchbox {
  flex:1;
  min-width:0;
  height:76px;
  display:flex;
  align-items:center;
  gap:16px;
  padding:0 24px;
  border:1px solid #bd8124;
  border-radius:16px;
  background:linear-gradient(180deg,#101012,#09090a);
  box-shadow:
    inset 0 0 0 1px rgba(255,214,123,.12),
    0 0 16px rgba(255,174,34,.22);
}

.search-icon {
  flex:none;
  width:30px;
  height:30px;
  border:4px solid var(--gold);
  border-radius:50%;
  position:relative;
}

.search-icon::after {
  content:"";
  position:absolute;
  width:14px;
  height:4px;
  background:var(--gold);
  right:-11px;
  bottom:-6px;
  transform:rotate(45deg);
  border-radius:2px;
}

#searchInput {
  width:100%;
  min-width:0;
  border:0;
  outline:none;
  background:transparent;
  color:#eee;
  font-size:21px;
}

#searchInput::placeholder { color:#777; }

.search-btn {
  width:124px;
  border:1px solid #d39b39;
  border-radius:12px;
  color:#14100a;
  font-size:20px;
  font-weight:900;
  cursor:pointer;
  background:linear-gradient(180deg,#ffe08a,#c98619);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45);
}

.toolbar {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  padding:0 6px 16px;
  border-bottom:1px solid rgba(204,140,29,.14);
}

.toolbar-left, .toolbar-right {
  display:flex;
  gap:10px;
  align-items:center;
  flex-wrap:wrap;
}

.label {
  color:#e5b95d;
  font-weight:800;
}

select {
  height:42px;
  padding:0 38px 0 14px;
  color:#d8d8d8;
  background:#0b0b0c;
  border:1px solid #5a3d0d;
  border-radius:8px;
  outline:none;
}

.meta {
  padding:13px 3px 10px;
  display:flex;
  justify-content:space-between;
  gap:12px;
  color:#aaa;
  font-size:14px;
}

#statusCount {
  color:#e8bb5b;
  font-weight:700;
}

.results {
  display:flex;
  flex-direction:column;
  gap:10px;
  max-height:calc(100vh - 360px);
  min-height:420px;
  overflow-y:auto;
  overflow-x:hidden;
  padding-right:8px;
  cursor:grab;
  scrollbar-width:thin;
  scrollbar-color:#b57b1d #111;
}

.results.dragging {
  cursor:grabbing;
  user-select:none;
}

.results::-webkit-scrollbar {
  width:10px;
}

.results::-webkit-scrollbar-track {
  background:#111;
  border-radius:10px;
}

.results::-webkit-scrollbar-thumb {
  background:linear-gradient(180deg,#d19a37,#7f5313);
  border-radius:10px;
  border:2px solid #111;
}

.sign-row {
  min-height:116px;
  display:grid;
  grid-template-columns:150px minmax(0,1fr) auto 22px;
  align-items:center;
  gap:20px;
  padding:10px 18px 10px 14px;
  border:1px solid #5b3c0b;
  border-radius:12px;
  background:
    linear-gradient(90deg, rgba(255,192,70,.025), transparent 30%),
    linear-gradient(180deg,#111112,#0c0c0d);
  transition:.16s ease;
}

.sign-row:hover {
  border-color:#9f6e1e;
  transform:translateY(-1px);
  box-shadow:0 8px 28px rgba(0,0,0,.26);
}

.thumb {
  height:94px;
  border-radius:8px;
  overflow:hidden;
  border:1px solid #7e5715;
  background:#050505;
  display:flex;
  align-items:center;
  justify-content:center;
}

.thumb img {
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
}

.sign-name {
  color:#f0c360;
  font-weight:900;
  font-size:23px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.sign-sub {
  margin-top:9px;
  color:#777;
  font-size:13px;
}

.count-wrap {
  min-width:120px;
  text-align:right;
}

.count-label {
  color:#aaa;
  font-size:13px;
  margin-bottom:4px;
}

.sign-count {
  color:#f0bd51;
  font-size:29px;
  line-height:1;
  font-weight:900;
}

.chev {
  color:#e4ac40;
  font-size:34px;
  font-family:Georgia,serif;
}

.empty, .error {
  margin-top:16px;
  border:1px solid #4f3510;
  border-radius:12px;
  background:#0d0d0e;
  color:#aaa;
  padding:40px 20px;
  text-align:center;
}

.error {
  color:#efb2b2;
  border-color:#603131;
}






.loading {
  opacity:.6;
  pointer-events:none;
}

@media (max-width:980px) {
  .app {
    grid-template-columns:1fr;
  }

  .brand {
    min-height:280px;
    height:280px;
    background-size:cover;
    background-position:center 47%;
    border-right:0;
    border-bottom:1px solid #8f6318;
  }

  .main {
    padding:28px 18px;
  }
}

@media (max-width:700px) {
  .results {
    max-height:65vh;
    min-height:360px;
  }

  .brand {
    min-height:220px;
    height:220px;
  }

  .subtitle {
    margin-bottom:20px;
  }

  .search-shell {
    gap:8px;
  }

  .searchbox {
    height:60px;
    padding:0 17px;
  }

  #searchInput {
    font-size:16px;
  }

  .search-btn {
    width:76px;
    font-size:16px;
  }

  .toolbar {
    align-items:flex-start;
    flex-direction:column;
  }

  .sign-row {
    grid-template-columns:92px minmax(0,1fr) auto;
    gap:12px;
    min-height:90px;
    padding:8px;
  }

  .thumb {
    height:70px;
  }

  .sign-name {
    font-size:17px;
  }

  .sign-sub {
    display:none;
  }

  .count-wrap {
    min-width:70px;
  }

  .count-label {
    display:none;
  }

  .sign-count {
    font-size:20px;
  }

  .chev {
    display:none;
  }
}
</style>
</head>

<body>
<div class="app">

  <aside class="brand" aria-label="ART'Z"></aside>

  <main class="main">
    <h1 class="title">SIGNATURE SEARCH</h1>
    <div class="subtitle">시그니처 이름 또는 개수로 원하는 시그니처를 검색해보세요.</div>

    <div class="search-shell">
      <div class="searchbox">
        <span class="search-icon" aria-hidden="true"></span>
        <input
          id="searchInput"
          type="search"
          inputmode="search"
          autocomplete="off"
          placeholder="시그니처 이름 또는 개수를 입력하세요."
        />
      </div>
      <button id="searchBtn" class="search-btn" type="button">검색</button>
    </div>

    <div class="toolbar">
      <div class="toolbar-left">
        <span class="label">필터</span>
        <select id="countFilter">
          <option value="all">전체 개수</option>
          <option value="100000">100,000 이상</option>
          <option value="50000">50,000 이상</option>
          <option value="10000">10,000 이상</option>
        </select>
      </div>

      <div class="toolbar-right">
        <span class="label">정렬</span>
        <select id="sortSelect">
          <option value="count-desc">개수 내림차순</option>
          <option value="count-asc" selected>개수 오름차순</option>
          <option value="name-asc">이름 가나다순</option>
        </select>
      </div>
    </div>

    <div class="meta">
      <span id="loadStatus">Supabase에서 불러오는 중...</span>
      <span id="statusCount">총 0개</span>
    </div>

    <section id="results" class="results"></section>
  </main>
</div>

<script>
/* =========================================================
   여기 두 값만 본인의 Supabase 값으로 변경하세요.
   anon key는 브라우저에서 사용하는 공개용 키입니다.
   signiture 테이블은 RLS에서 SELECT만 허용해 두세요.
========================================================= */
const SUPABASE_URL = "https://epylshczriryndlupksu.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVweWxzaGN6cmlyeW5kbHVwa3N1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUwNjg3ODAsImV4cCI6MjEwMDY0NDc4MH0.R1YRtX3cOd38kAlhVwyLy4DHl1A-0xHMOr323zTkegA";

const TABLE_NAME = "signiture";

const client = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

let allSigns = [];
let filteredSigns = [];

const $ = (id) => document.getElementById(id);

function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[c]));
}

function formatCount(value) {
  const n = Number(value || 0);
  return Number.isFinite(n) ? n.toLocaleString("ko-KR") : "0";
}

async function loadSigns() {
  $("loadStatus").textContent = "Supabase에서 최신 시그니처를 불러오는 중...";
  $("results").classList.add("loading");

  try {
    const { data, error } = await client
      .from(TABLE_NAME)
      .select("id,count,name,image")
      .order("count", { ascending:true });

    if (error) throw error;

    allSigns = Array.isArray(data) ? data : [];
    applyFilters();

    $("loadStatus").textContent = "최신 데이터";
  } catch (err) {
    console.error(err);
    $("loadStatus").textContent = "";
    $("statusCount").textContent = "불러오기 실패";
    $("results").innerHTML =
      `<div class="error">
        Supabase 데이터를 불러오지 못했습니다.<br><br>
        <small>${esc(err.message || err)}</small>
      </div>`;
  } finally {
    $("results").classList.remove("loading");
  }
}

function applyFilters() {
  const keyword = $("searchInput").value.trim().toLowerCase();
  const normalizedKeyword = keyword.replace(/,/g, "");

  const minimum = $("countFilter").value === "all"
    ? 0
    : Number($("countFilter").value);

  filteredSigns = allSigns.filter(sign => {
    const name = String(sign.name || "").toLowerCase();
    const countText = String(sign.count ?? "").replace(/,/g, "");

    const keywordMatch =
      !normalizedKeyword ||
      name.includes(normalizedKeyword) ||
      countText.includes(normalizedKeyword);

    const countMatch = Number(sign.count || 0) >= minimum;

    return keywordMatch && countMatch;
  });

  const sort = $("sortSelect").value;

  filteredSigns.sort((a,b) => {
    if (sort === "count-asc")
      return Number(a.count || 0) - Number(b.count || 0);

    if (sort === "name-asc")
      return String(a.name || "").localeCompare(
        String(b.name || ""),
        "ko"
      );

    return Number(b.count || 0) - Number(a.count || 0);
  });

  render();
}

function render() {
  $("statusCount").textContent =
    `총 ${filteredSigns.length.toLocaleString("ko-KR")}개`;

  if (!filteredSigns.length) {
    $("results").innerHTML =
      `<div class="empty">검색 결과가 없습니다.</div>`;
    return;
  }

  $("results").innerHTML = filteredSigns.map(sign => `
    <article class="sign-row">
      <div class="thumb">
        <img
          loading="lazy"
          src="${esc(sign.image)}"
          alt="${esc(sign.name)}"
          onerror="this.style.display='none'"
        />
      </div>

      <div>
        <div class="sign-name">${esc(sign.name)}</div>
        <div class="sign-sub">ART'Z SIGNATURE</div>
      </div>

      <div class="count-wrap">
        <div class="count-label">후원 개수</div>
        <div class="sign-count">${formatCount(sign.count)}</div>
      </div>

      <div class="chev">›</div>
    </article>
  `).join("");
}

$("searchInput").addEventListener("input", () => {
  applyFilters();
});

$("searchInput").addEventListener("keydown", e => {
  if (e.key === "Enter") {
    applyFilters();
  }
});

$("searchBtn").addEventListener("click", () => {
  applyFilters();
});

$("countFilter").addEventListener("change", () => {
  applyFilters();
});

$("sortSelect").addEventListener("change", () => {
  applyFilters();
});


const resultsEl = $("results");

let isDragging = false;
let startY = 0;
let startScrollTop = 0;

resultsEl.addEventListener("mousedown", (e) => {
  isDragging = true;
  startY = e.clientY;
  startScrollTop = resultsEl.scrollTop;
  resultsEl.classList.add("dragging");
});

window.addEventListener("mousemove", (e) => {
  if (!isDragging) return;
  resultsEl.scrollTop = startScrollTop - (e.clientY - startY);
});

window.addEventListener("mouseup", () => {
  isDragging = false;
  resultsEl.classList.remove("dragging");
});

resultsEl.addEventListener("mouseleave", () => {
  isDragging = false;
  resultsEl.classList.remove("dragging");
});

loadSigns();
</script>
</body>
</html>
